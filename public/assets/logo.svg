<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="sandTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="sandMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sandBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Tier 1: VRAM Hot Slab (Top Bun) -->
  <path d="M6 14C6 9 14 6 24 6C34 6 42 9 42 14C42 16.5 38 18.5 32 19.5L16 19.5C10 18.5 6 16.5 6 14Z" fill="url(#sandTop)" filter="url(#glow)"/>
  
  <!-- Tier 2: DDR5 Warm Pool (Middle Filling / MoE Router Layer) -->
  <rect x="8" y="22" width="32" height="6" rx="3" fill="url(#sandMid)"/>
  <circle cx="16" cy="25" r="1.5" fill="#f8fafc"/>
  <circle cx="24" cy="25" r="1.5" fill="#f8fafc"/>
  <circle cx="32" cy="25" r="1.5" fill="#f8fafc"/>
  
  <!-- Tier 3: Cold NVMe Storage (Bottom Bun) -->
  <path d="M6 34C6 31.5 10 29.5 16 28.5L32 28.5C38 29.5 42 31.5 42 34C42 39 34 42 24 42C14 42 6 39 6 34Z" fill="url(#sandBot)"/>
